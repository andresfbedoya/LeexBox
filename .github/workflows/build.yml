name: build
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bash ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LeexBox
          path: build/LeexBox.apk
